name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -t ghcr.io/jakoblui-works/storybook-host:${{ github.sha }} -t ghcr.io/jakoblui-works/storybook-host:latest .
          docker push ghcr.io/jakoblui-works/storybook-host:${{ github.sha }}
          docker push ghcr.io/jakoblui-works/storybook-host:latest
      # infra replaces this with the deploy's result, on this commit.
      - name: Mark the commit as waiting to deploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=deploy -f description="Waiting to deploy"
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/jakoblui-works/infra/dispatches -f event_type=deploy \
            -f 'client_payload[repo]=storybook-host' -f "client_payload[sha]=$GITHUB_SHA"
